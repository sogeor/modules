name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [master]

permissions: {}

jobs:
  scorecard:
    name: scorecard
    uses: sogeor/workflows/.github/workflows/scorecard.yml@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      scorecard-token: ${{ secrets.SCORECARD_TOKEN }}
