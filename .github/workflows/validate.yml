name: validate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint:
    name: linters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install --user --quiet --require-hashes -r .github/requirements-lint.txt
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: shellcheck
        run: git ls-files '*.sh' | xargs --no-run-if-empty shellcheck -x

      - name: yamllint
        run: yamllint --strict .

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor --offline --min-severity low .github/workflows

  opentofu:
    name: opentofu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          python3 -m pip install --user --quiet --require-hashes -r .github/requirements-lint.txt
          tools/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: fmt, validate, tflint, test, terraform-docs
        run: tools/check-modules.sh

      - name: Talos configuration (talosctl validate)
        run: tools/check-talos.sh

      - name: Cluster API manifests (kubeconform)
        run: tools/check-capi.sh

  policies:
    name: policies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          python3 -m pip install --user --quiet --require-hashes -r .github/requirements-lint.txt
          tools/install-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: JSON Schema
        run: tools/check-schema.sh

      - name: conftest fmt
        run: conftest fmt --check policies/conftest

      - name: conftest verify
        run: conftest verify --policy policies/conftest/cluster --data modules/cluster-spec/matrix.yaml

      - name: conftest test clusters
        run: conftest test --policy policies/conftest/cluster --data modules/cluster-spec/matrix.yaml clusters/

  security:
    name: security
    uses: sogeor/workflows/.github/workflows/security-lite.yml@7d7cabb75c9c2116cb2a669d65f23609f1504660 # v0.1.1
    permissions:
      contents: read
      security-events: write
    with:
      checkov: true
