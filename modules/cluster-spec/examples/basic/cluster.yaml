cluster: lab
cluster_id: 9
distribution: kubeadm
kubernetes_version: "1.37.1"
topology: single
profiles: [core]
pools:
  cp:
    role: control-plane
    os: ubuntu-2404
    provider: proxmox
    site: home
    size: m
    count: 1
  workers:
    role: worker
    os: ubuntu-2404
    provider: proxmox
    site: home
    size: l
    autoscale: { min: 0, max: 2 }
